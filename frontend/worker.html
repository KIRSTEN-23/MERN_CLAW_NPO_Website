<!doctype html>
<html lang="en-ZA">
  <head>
    <!-- CDN dependencies and the import map keep browser modules runnable without a frontend build. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CLAW Worker</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/public/assets/shared/logo.svg" />
    <!-- Bootstrap handles layout utilities; no frontend package installation. -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- Open Sans: regular, semibold, bold and semibold italic, with fallback text during loading. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;1,600&amp;family=Montserrat:wght@400;500;600;700&amp;display=swap"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/accessibility.css" />
    <link rel="stylesheet" href="/src/worker/worker.css" />

    <!-- Keep React and React DOM on the same version and React instance. -->
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.2.0",
          "react-dom/client": "https://esm.sh/react-dom@19.2.0/client?external=react"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Enable JavaScript to use the CLAW worker app.</noscript>
    <script type="module" src="/src/worker/main.js"></script>
  </body>
</html>
