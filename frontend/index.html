<!doctype html>
<html lang="en-ZA">
  <head>
    <!-- CDN dependencies and the import map keep browser modules runnable without a frontend build. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CLAW Virtual Adoption | Support a Dog’s Journey</title>
    <meta name="description" content="You don’t have to take them home to give them care. Meet CLAW’s dogs and explore six-month virtual adoption supporting food, shelter and veterinary care." />
    <link rel="icon" type="image/svg+xml" href="/public/assets/shared/logo.svg" />
    <!-- runtime-seo -->
    <meta name="keywords" content="CLAW, virtual dog adoption, dog sponsorship, animal welfare, South Africa, student project" />
    <meta name="twitter:title" content="CLAW Virtual Adoption | Support a Dog’s Journey" />
    <meta name="twitter:description" content="Explore six-month virtual dog sponsorship through this CLAW student project." />
    <meta name="theme-color" content="#516847" />
    <meta property="og:site_name" content="CLAW Virtual Adoption" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_ZA" />
    <meta property="og:title" content="CLAW Virtual Adoption | Support a Dog’s Journey" />
    <meta property="og:description" content="Choose a dog. Support their journey. Help provide care while they wait for a forever home." />
    <meta property="og:image" content="/public/assets/home/hero-photo.png" />
    <meta property="og:image:alt" content="Dogs in CLAW’s care" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Bootstrap handles layout utilities; no frontend package installation. -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- Open Sans: regular, semibold, bold and semibold italic, with fallback text during loading. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;1,600&amp;family=Montserrat:wght@400;500;600;700&amp;display=swap"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="/src/styles/base.css" />

    <!-- Keep React and React DOM on the same version and React instance. -->
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.2.0",
          "react-dom/client": "https://esm.sh/react-dom@19.2.0/client?external=react"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>CLAW Virtual Adoption: support dogs with food, shelter and veterinary care while they wait for a forever home. Enable JavaScript to browse dog profiles.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
